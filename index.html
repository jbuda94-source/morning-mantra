<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Mantra</title>
<meta name="theme-color" content="#1b1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mantra">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #1b1a2e;
    --bg-mid: #3a2d4a;
    --bg-low: #b8674e;
    --ink: #f6efe6;
    --ink-soft: rgba(246, 239, 230, 0.68);
    --ink-faint: rgba(246, 239, 230, 0.42);
    --card: rgba(255, 255, 255, 0.07);
    --card-line: rgba(255, 255, 255, 0.12);
    --accent: #f2b880;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg-top);
    background-image: linear-gradient(175deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-low) 130%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 40px) 22px calc(env(safe-area-inset-bottom) + 48px);
  }
  .date {
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 6px;
  }
  .greeting {
    font-family: "Fraunces", Georgia, serif; font-weight: 300;
    font-size: 22px; color: var(--ink-soft); margin-bottom: 34px;
  }
  .label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px;
  }
  section { margin-bottom: 44px; }

  .mantra p {
    font-family: "Fraunces", Georgia, serif; font-weight: 400;
    font-size: clamp(24px, 6.6vw, 30px); line-height: 1.32;
    margin-bottom: 14px; opacity: 0; transform: translateY(8px);
    animation: rise 0.9s ease forwards;
  }
  .mantra p:nth-child(2) { animation-delay: 0.35s; }
  .mantra p:nth-child(3) { animation-delay: 0.7s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .mantra p { animation: none; opacity: 1; transform: none; } }

  .toggle {
    margin-top: 6px; background: none; border: 1px solid var(--card-line);
    color: var(--ink-soft); font: 500 13px "Inter", sans-serif;
    padding: 9px 14px; border-radius: 999px; cursor: pointer;
  }
  .toggle:active { background: var(--card); }

  .news { list-style: none; display: grid; gap: 10px; }
  .news a {
    display: block; text-decoration: none; color: var(--ink);
    background: var(--card); border: 1px solid var(--card-line);
    border-radius: 16px; padding: 16px 18px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .news a:active { background: rgba(255,255,255,0.12); }
  .news .title { font-size: 16px; line-height: 1.4; font-weight: 500; }
  .news .src { margin-top: 6px; font-size: 12px; color: var(--ink-faint); }
  .muted { color: var(--ink-faint); font-size: 14px; }
  .skeleton {
    height: 74px; border-radius: 16px; background: var(--card);
    border: 1px solid var(--card-line); animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.5; } }

  .reminder {
    background: var(--card); border: 1px solid var(--card-line);
    border-left: 3px solid var(--accent);
    border-radius: 6px 16px 16px 6px; padding: 18px 20px;
  }
  .reminder p {
    font-family: "Fraunces", Georgia, serif; font-size: 20px; line-height: 1.4; font-weight: 400;
  }
  footer { text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <div class="date" id="date"></div>
  <div class="greeting" id="greeting">Good morning.</div>

  <section class="mantra">
    <div class="label">Today's mantra</div>
    <div id="mantra"></div>
    <button class="toggle" id="toggle">Show original</button>
  </section>

  <section>
    <div class="label">Good news</div>
    <ul class="news" id="news">
      <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
    </ul>
  </section>

  <section>
    <div class="label">Today's reminder</div>
    <div class="reminder"><p id="reminder"></p></div>
  </section>

</main>

<script src="/content.js"></script>
<script>
  // Date in Pacific time so the day flips at local midnight.
  const tz = "America/Los_Angeles";
  const now = new Date();
  const ymd = new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(now); // 2026-10-27
  const hour = +new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", hour12: false }).format(now);

  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("en-US", { timeZone: tz, weekday: "long", month: "long", day: "numeric" }).format(now);
  document.getElementById("greeting").textContent =
    hour < 12 ? "Good morning, John." : hour < 17 ? "Good afternoon, John." : "Good evening, John.";

  // Day number since epoch → stable picks for the whole day.
  const dayNum = Math.floor(Date.parse(ymd + "T00:00:00Z") / 86400000);
  // Different strides so mantra and reminder don't repeat in lockstep.
  const mantra = MANTRAS[dayNum % MANTRAS.length];
  const reminder = REMINDERS[(dayNum * 7 + 3) % REMINDERS.length];

  const box = document.getElementById("mantra");
  const toggle = document.getElementById("toggle");
  let showingOriginal = false;
  function render(lines) {
    box.innerHTML = "";
    lines.forEach((l) => { const p = document.createElement("p"); p.textContent = l; box.appendChild(p); });
  }
  render(mantra);
  toggle.addEventListener("click", () => {
    showingOriginal = !showingOriginal;
    render(showingOriginal ? ORIGINAL : mantra);
    toggle.textContent = showingOriginal ? "Show today's version" : "Show original";
  });

  document.getElementById("reminder").textContent = reminder;

  // Positive news
  const list = document.getElementById("news");
  fetch("/api/news")
    .then((r) => r.json())
    .then(({ headlines }) => {
      list.innerHTML = "";
      if (!headlines || !headlines.length) {
        list.innerHTML = '<li class="muted">No headlines right now. Check back in a bit.</li>';
        return;
      }
      headlines.forEach((h) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = h.link; a.target = "_blank"; a.rel = "noopener";
        const t = document.createElement("div"); t.className = "title"; t.textContent = h.title;
        const s = document.createElement("div"); s.className = "src"; s.textContent = h.source;
        a.append(t, s); li.appendChild(a); list.appendChild(li);
      });
    })
    .catch(() => {
      list.innerHTML = '<li class="muted">Couldn\'t load headlines. You\'re probably offline.</li>';
    });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
